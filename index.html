<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topdesk-sakene</title>
<style>
/* One-screen reveal: a single button, then headline over the empty queue */
body{margin:0}
:root{--bg:#0e1116;--fg:#f4f6f8;--muted:#9aa4b2;--accent:#0a7bb5;--accent-hi:#1394d6;color-scheme:dark;
--display:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);padding-inline:16px;box-sizing:border-box}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;text-align:center;padding-block:2rem}
#go{font:600 clamp(1.4rem,4vw,2.2rem) var(--display);padding:1.1rem 2.4rem;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 30px rgba(10,123,181,.45)}
#go:hover,#go:focus-visible{background:var(--accent-hi);outline:3px solid #fff3;outline-offset:3px}
h1{font-size:clamp(1.8rem,5vw,4rem);margin:0;text-wrap:balance;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
img{max-width:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fade 1s .3s both}
#pb{font:600 1.1rem var(--display);padding:.7rem 1.4rem;border:1px solid var(--muted);border-radius:10px;background:transparent;color:var(--fg);cursor:pointer}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){h1,img{animation:none}}
</style>
</head><body>
<div class="wrap" id="start"><button id="go" type="button">Klikk for å åpne</button></div>
<div class="wrap" id="show" hidden>
  <h1>Sånn. Nå har jeg løst Topdesk-sakene 😎</h1>
  <img src="topdesk.png" alt="Tom saksliste i Topdesk: IT Studentorakel (Alle)">
  <button id="pb" type="button" hidden>▶ Spill av lyd</button>
</div>
<audio id="a" src="fredag.mp3" preload="auto" loop></audio>
<script>
const a=document.getElementById('a'),pb=document.getElementById('pb');
function play(){a.play().then(()=>{pb.hidden=true}).catch(()=>{pb.hidden=false})}
document.getElementById('go').addEventListener('click',()=>{document.getElementById('start').hidden=true;document.getElementById('show').hidden=false;play()});
pb.addEventListener('click',play);
</script>
</body></html>
